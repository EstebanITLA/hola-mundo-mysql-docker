services:

  app:
    image: php:8.2-apache
    container_name: hola-mundo-app
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: hola-mundo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hola_mundo
    ports:
      - "3306:3306"